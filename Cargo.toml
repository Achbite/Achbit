[workspace]
members = [
  "crates/achbit-kernel-abi",
  "crates/achbit-kernel-tools",
  "crates/achbit-kernel-runtime",
  "crates/achbit-kernel-client",
  "crates/achbit-kernel-daemon",
  "crates/achbit-first-party-tools",
  "crates/achbit-host-web",
  "crates/achbit-host-connection",
  "shells/cli",
  "shells/tui",
  "plugins/computer-use/native",
]
resolver = "2"

[workspace.package]
version = "0.6.63"
edition = "2021"
rust-version = "1.86"
license = "MIT"
authors = ["Achbit Team"]

[profile.dev]
incremental = true

[profile.release]
incremental = true

[workspace.dependencies]
achbit-kernel-abi = { path = "crates/achbit-kernel-abi" }
achbit-kernel-tools = { path = "crates/achbit-kernel-tools" }
achbit-kernel-runtime = { path = "crates/achbit-kernel-runtime" }
achbit-kernel-daemon = { path = "crates/achbit-kernel-daemon" }
achbit-kernel-client = { path = "crates/achbit-kernel-client" }
achbit-host-connection = { path = "crates/achbit-host-connection" }
achbit-first-party-tools = { path = "crates/achbit-first-party-tools" }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "system-proxy"] }
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }
regex = "1"
pdf-extract = "0.9"
sha2 = "0.10"
ratatui = "0.29"
crossterm = "0.28"
portable-pty = "0.8"
async-stream = "0.3"
bytes = "1"
base64 = "0.22"
roxmltree = "0.20"
libc = "0.2"

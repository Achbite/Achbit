[package]
name = "achbit-first-party-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Out-of-process first-party tool provider for DeepCode."

[[bin]]
name = "achbit-first-party-provider"
path = "src/main.rs"

[dependencies]
base64.workspace = true
achbit-host-connection.workspace = true
pdf-extract.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
roxmltree.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"

typst = "=0.13.1"
typst-kit = { version = "=0.13.1", default-features = false, features = ["fonts", "embed-fonts"] }
typst-pdf = "=0.13.1"
# Keep Typst/stacker compatible with Rust 1.86; newer psm pulls a Rust 1.88 build dependency.
psm = "=0.1.27"

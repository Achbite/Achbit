[package]
name = "achbit-host-connection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
debug-control = []

[dependencies]
achbit-kernel-abi.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
base64.workspace = true
tempfile = "3"
fs2 = "0.4"
zip = { version = "6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

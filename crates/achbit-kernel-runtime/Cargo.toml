[package]
name = "achbit-kernel-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "DeepCode local Kernel tool executors."

[dependencies]
achbit-kernel-abi.workspace = true
achbit-kernel-tools.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["gzip", "brotli", "deflate"] }
notify = "=8.2.0"
encoding_rs = "0.8"
htmd = "=0.2.2"
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
libc.workspace = true
portable-pty.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Console", "Win32_System_Rpc"] }

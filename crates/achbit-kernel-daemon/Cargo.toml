[package]
name = "achbit-kernel-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Achbit Kernel daemon that owns runtime, provider transport, and localhost API."

[features]
debug-control = ["achbit-host-connection/debug-control"]

[dependencies]
tempfile = "3"
axum.workspace = true
achbit-kernel-abi.workspace = true
achbit-host-connection.workspace = true
achbit-first-party-tools.workspace = true
achbit-kernel-runtime.workspace = true
achbit-kernel-tools.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["process", "io-util", "fs"] }
tower-http.workspace = true
reqwest.workspace = true
hyper.workspace = true
async-stream.workspace = true
bytes.workspace = true
getrandom = "0.3"
regex.workspace = true
rusqlite.workspace = true
base64.workspace = true
sha2.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
httpdate = "1"
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
gif = "0.13"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

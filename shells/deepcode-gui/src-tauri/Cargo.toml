[workspace]

[package]
name = "deepcode-gui-tauri-shell"
version = "0.6.55"
edition = "2021"
license = "MIT"
rust-version = "1.86"

[features]
default = []
debug-control = ["deepcode-host-connection/debug-control", "objc2-web-kit/WKContentWorld", "objc2-web-kit/WKFrameInfo", "objc2-app-kit/NSApplication", "objc2-app-kit/block2", "objc2/exception", "objc2-app-kit/objc2-core-graphics", "dep:objc2-core-graphics"]

[[bin]]
name = "DeepCode-GUI"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
deepcode-kernel-abi = { path = "../../../crates/deepcode-kernel-abi" }
deepcode-host-connection = { path = "../../../crates/deepcode-host-connection" }
getrandom = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.2", features = ["unstable"] }
tauri-plugin-dialog = "2"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg"] }
webview2-com = "0.38"
windows-core = "0.61"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Storage_Xps"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGWindow", "CGImage", "CGGeometry"], optional = true }
block2 = "0.6"
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "block2"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSOpenPanel", "NSSavePanel", "NSWindow", "NSResponder", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSData", "NSDictionary", "NSError", "NSBundle"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg"] }

[package]
name = "deepcode-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
deepcode-kernel-client.workspace = true
deepcode-host-connection.workspace = true
crossterm.workspace = true
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
pulldown-cmark = { version = "0.13", default-features = false }
pulldown-latex = "0.7.1"
tui-math = "0.1.1"
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
